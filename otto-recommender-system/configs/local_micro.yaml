project:
  name: otto-recommender-system
  mode: local_micro

paths:
  data_sample: data/sample
  data_raw: data/raw
  interim: data/interim
  processed: data/processed
  features: artifacts/features
  candidates: artifacts/candidates
  models: artifacts/models
  submissions: artifacts/submissions
  reports: artifacts/reports
  logs: logs

data:
  sample_sessions_limit: 10000
  validation_days: 7
  targets:
    - clicks
    - carts
    - orders

candidates:
  topk_per_strategy: 40
  final_topk: 20
  strategies:
    - recent_items
    - covisitation_clicks
    - covisitation_carts_orders

runtime:
  seed: 42
  n_jobs: 4
  cache_enabled: true
